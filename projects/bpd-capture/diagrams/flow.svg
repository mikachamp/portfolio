<svg viewBox="0 0 800 540" role="img" aria-labelledby="flow-t flow-d" xmlns="http://www.w3.org/2000/svg" class="dgfile">
<g class="dg">
<title id="flow-t">BPD Capture data flow</title>
<desc id="flow-d">Inputs are: camera photos and videos, filed by stage and step; media imported from the gallery; typed job details such as CE number, client, project, due date and site; sign-offs and work-ticket items; and hold reasons and dispatch details. Each input is normalised and checked: CE numbers are upper-cased and limited to 64 characters, and file names and folders are checked. Data is then saved as SQLite rows and as files in the job folder, with a gallery copy for camera captures. Every write feeds a change feed that would push to sync after 5 quiet seconds, if sync were on. Screens and Insights read the data back: overdue jobs, jobs due this week, on-time rate and turnaround. Outputs are: on-screen lists, calendar and insights, which stay on the phone; a local backup before each update, keeping the last 3, which stays on the phone; PDF reports and the daily digest sent by email to a saved dispatcher or the share sheet; backup zips with an optional password through the share sheet; and sync to a GitHub data branch once it is switched on.</desc>
