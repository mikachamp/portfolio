<title id="wf-t">BPD Capture order workflow with sign-offs</title>
<desc id="wf-d">Four lanes: stage, photos, sign-off and any time. Stage: a new order is opened with a CE number, client name and due date; then Sample, a prototype for the client; Production, with machining, fabricating and finishing; Dispatch, packed and sent out; Installed, in store; and Completed, with a job report and daily digest. Photos: pick the job then shoot; sample shots; one set per production step; what left and how it was packed; before and after photos at install; and a photo grid in the PDF. Sign-off: opening is logged; the client approves the sample; each production step is signed off by a named person; dispatch records the waybill; installation is signed off as client proof; and a completed order can be reopened. Any time: an order can be put on hold with a reason and resumed, and a due date makes late orders show as overdue in Insights.</desc>
