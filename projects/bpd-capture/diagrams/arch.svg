<title id="arch-t">BPD Capture architecture</title>
<desc id="arch-d">The Android app is one React Native and Expo codebase. It opens with a Three.js logo animation rendered on expo-gl. Its screens (jobs, floor jobs, order, capture, calendar, insights, search, clients and settings) call four services: validation of CE numbers and file names, backup, PDF reports and the update check. Below them sit the data layer on expo-sqlite, file storage for job folders and a gallery copy, and a sync engine that is built but not switched on. On the phone, data is kept in a SQLite database, in one folder per CE number, in a BPD Capture gallery album for camera captures, and the sync sign-in token in Android's encrypted secure store. Three things can leave the phone: PDF reports and backup zips through the mail app or share sheet, an update check and APK download from GitHub releases when the user taps Check for updates, and sync to a GitHub data branch once it is switched on. The Windows desktop app is built with Electron, Vite and React. Its renderer shows the dashboard, calendar, webcam capture and a Three.js loading animation; a preload bridge with context isolation and sandbox on; and a main process that handles IPC with path checks, a node:sqlite database and job files in the Windows app-data folder, with the sync token encrypted by Windows. The desktop main process uses the same sync engine to the same GitHub data branch, once sync is switched on.</desc>
