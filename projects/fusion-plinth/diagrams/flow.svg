<title id="flow-t">Design flow from brief to print</title>
<desc id="flow-d">Step 1, the brief: 315 mm maximum diameter, 320 mm high, white, one piece, fits the H2D, no support marks, a soft rope-like look. Step 2, the parameters: 5 tubes, 120 mm each, a 180 degree twist, a solid centre core, flat top and bottom. Step 3, the model: native Fusion features, a helix path per tube with a tube swept on each, joined and trimmed; round 3 was a Python-generated surface instead. Step 4, the checks: the share of side area steeper than 45 degrees, which is 0 percent on the final model, the 315 mm maximum diameter, and my review of the renders. If a check fails, my note goes back to the parameters for the next round; there were 4 rounds. Step 5: the agent exports an STL from the final model after I sign off. Step 6, not done yet: print it in one piece on the Bambu Lab H2D with no supports.</desc>
