<title id="arch-t">Architecture: me, the AI agent, Fusion 360 and the printer</title>
<desc id="arch-d">I give the AI agent plain-language notes and get renders and overhang numbers back. The AI agent is a cloud model. It writes modelling scripts and sends them through Fusion 360's API connector on my laptop, and gets screenshots and measurements back. The scripts run inside Fusion and build or edit a parametric CAD model: five helix paths, a 120 mm tube swept on each, joined to a solid core and trimmed flat top and bottom; tube size and twist are editable. The final model is exported as an STL file on the laptop. The next step, not done yet, is printing it in one piece without supports on a Bambu Lab H2D.</desc>
