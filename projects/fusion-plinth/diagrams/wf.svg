<title id="wf-t">Workflow with the human review steps</title>
<desc id="wf-d">Three lanes: Me, AI agent and Fusion 360. Step 1: I give the brief and the printer limits. Step 2: the agent writes a script and runs it in Fusion. Step 3: Fusion rebuilds the model, and the agent takes a screenshot and measures the overhang. Step 4 is my review: does it look right, and is the overhang 0 percent? If not, I give a plain-language note and the agent writes the next script; this happened in 4 rounds. If yes, step 5: the agent rebuilds the final shape as native Fusion features. Step 6: the agent exports the STL. Step 7, not done yet: I print the sample on the H2D and check the first layer and the lobe undersides.</desc>
