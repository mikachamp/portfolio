<title id="flow-t">Agent Chat data flow for a message and an approval</title>
<desc id="flow-d">Top road, Mika in the app: Mika types in the composer. While typing, a read-only preview call returns a badge: will sign with the task and action, plain, or a near miss with the reason; the preview has no secret, signs nothing and writes nothing. On send, the renderer passes only the channel, the text and the reply id through chat:send, where the sender and arguments are checked first. The main process sets the sender to Mika, the role to human, the time and the id, signs the whole line with HMAC-SHA256 and appends it to the chat log. Bottom road, an agent: an agent, Claude or a hand edit writes through chat-cli.js post, which has no secret, so the line is unsigned and has the agent role even if it claims to be Mika. A signed line copied back into the file keeps its id. All lines land in the append-only chat log. The main process watches the log and classifies each line in order: has this id been seen before, does the signature check out in constant time, is the role human and the sender Mika, does the whole text fit the approval grammar, does the task match the thread. The signature is removed before the line goes to the window. There are four outcomes: a signed approval shows a lock and a badge with the task and action; a signed message shows a lock but no approval; an unsigned line is advice only and cannot approve; a copied line with an id seen before is ignored.</desc>
