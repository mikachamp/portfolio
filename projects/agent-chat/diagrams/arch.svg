<title id="arch-t">Agent Chat architecture</title>
<desc id="arch-d">The Agent Chat desktop app has three parts. The renderer is the window: sandboxed, with context isolation and no Node, served from a private app protocol under a strict content security policy; it shows channels, task threads, the Needs you list and the composer with a live approval preview, and it never sees the secret or any signature. The preload bridge exposes a fixed API of 13 calls and 5 event listeners; sending a message carries only the channel, the text and the reply id. The main process is the only trusted part: every IPC handler checks the sender first; it holds the signing secret, fills in the sender, role, time and id, signs each composer line with HMAC-SHA256 and appends it to the shared chat log. It watches the log and classifies each line with the replay ledger, signature check and approval grammar. It also scans the task queue, lock and role files read-only for the Needs you list. On the right is the vault on the local disk with the append-only chat log and the task files. Agents and Claude are untrusted writers: they post through chat-cli.js, which has no secret, so their lines are always unsigned. LM Studio is optional, off by default, and called on this machine only.</desc>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c"/></marker>
</defs>

<rect class="grp" x="20" y="30" width="470" height="570" rx="12"/>
<text class="tt" x="36" y="56">Agent Chat desktop app</text>
<text class="ts" x="36" y="74">Electron 44 &#183; Windows &#183; version 1.2.2</text>

<rect class="bx" x="36" y="90" width="438" height="136" rx="8"/>
<text class="t" x="50" y="114">Renderer (the window)</text>
<text class="ts" x="50" y="136">sandbox &#183; contextIsolation &#183; no Node</text>
<text class="ts" x="50" y="153">served from app://local/ &#183; strict CSP</text>
<text class="ts" x="50" y="172">channels &#183; task threads &#183; Needs you</text>
<text class="ts" x="50" y="189">composer with a live approval preview</text>
<text class="ts ta" x="50" y="210">never sees the secret or a signature</text>

<path class="ln" d="M255,226 V244" marker-start="url(#am)" marker-end="url(#am)"/>
<rect class="bx" x="36" y="246" width="438" height="92" rx="8"/>
<text class="t" x="50" y="270">Preload bridge (contextBridge)</text>
<text class="ts" x="50" y="291">fixed API: 13 calls, 5 event listeners</text>
<text class="ts" x="50" y="308">send() carries channel, text, replyTo only</text>
<text class="ts" x="50" y="325">no way to set sender, role, time, id or sig</text>

<path class="ln" d="M255,338 V356" marker-start="url(#am)" marker-end="url(#am)"/>
<text class="ts" x="266" y="352">IPC invoke / events</text>
<rect class="bx-a" x="36" y="358" width="438" height="226" rx="8"/>
<text class="t" x="50" y="382">Main process (the only trusted part)</text>
<text class="ts" x="50" y="404">every IPC handler checks the sender first</text>
<text class="ts" x="50" y="422">holds the signing secret; never sends it</text>
<text class="ts" x="50" y="440">sets sender = Mika, role, time and id</text>
<text class="ts" x="50" y="458">signs each composer line (HMAC-SHA256)</text>
<text class="ts" x="50" y="476">classify: replay ledger &#8594; verify &#8594; grammar</text>
<text class="ts" x="50" y="494">watches the log (fs.watch + 1.5 s poll)</text>
<text class="ts" x="50" y="512">scans task files for the Needs you list</text>
<text class="ts" x="50" y="530">tray, @Mika notifications, title count</text>
<text class="ts" x="50" y="548">blocks navigation, pop-ups, permissions</text>
<text class="ts" x="50" y="566">quits if launched with debug flags</text>

<path class="ln-a" d="M474,410 H516 V150 H572" marker-end="url(#aa)"/>
<text class="ts ta" x="510" y="290" transform="rotate(-90 510 290)" text-anchor="middle">append signed line</text>
