<rect class="bx-c" x="776" y="410" width="188" height="96" rx="8"/>
<text class="t" x="788" y="434">chat-cli.js</text>
<text class="ts" x="788" y="455">plain Node</text>
<text class="ts" x="788" y="472">has no secret</text>
<text class="ts" x="788" y="489">verify: UNVERIFIED</text>
<path class="ln-c" d="M964,458 H1000 V150 H968" marker-end="url(#ac)"/>
<text class="ts tc" x="1024" y="300" transform="rotate(-90 1024 300)" text-anchor="middle">append unsigned line</text>

<path class="ln" d="M474,572 H556" marker-end="url(#am)"/>
