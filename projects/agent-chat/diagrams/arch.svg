<path class="ln" d="M576,290 H540"/>
<text class="ts" x="556" y="400" transform="rotate(-90 556 400)" text-anchor="middle">watch + read</text>

<rect class="grp-l" x="560" y="30" width="420" height="310" rx="12"/>
<text class="tt" x="576" y="56">Vault on the local disk</text>
<text class="ts" x="576" y="74">plain files &#183; no server &#183; no account</text>
<rect class="bx" x="576" y="90" width="388" height="114" rx="8"/>
<text class="t" x="590" y="114">Shared chat log</text>
<text class="ts" x="590" y="136">append-only, one JSON line per message</text>
<text class="ts" x="590" y="153">one complete line per write; never rewritten</text>
<text class="ts" x="590" y="170">readers skip half or broken lines</text>
<text class="ts" x="590" y="190">signed lines from the app only</text>
<rect class="bx" x="576" y="216" width="388" height="112" rx="8"/>
<text class="t" x="590" y="240">Task queue, lock and role files</text>
<text class="ts" x="590" y="261">written by agents; the app only reads them</text>
<text class="ts" x="590" y="278">names and task ids checked by pattern</text>
<text class="ts" x="590" y="295">over 256 KB or symbolic link: skipped</text>
<text class="ts" x="590" y="314">shown as &#8220;from task files, unverified&#8221;</text>

<rect class="grp-c" x="560" y="370" width="420" height="150" rx="12"/>
<text class="tt tc" x="576" y="396">Untrusted writers</text>
<rect class="bx-c" x="576" y="410" width="190" height="96" rx="8"/>
<text class="t" x="588" y="434">Agents and Claude</text>
<text class="ts" x="588" y="455">post and read</text>
<text class="ts" x="588" y="472">through the CLI;</text>
<text class="ts" x="588" y="489">chat is advice</text>
