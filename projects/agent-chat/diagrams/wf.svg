<g class="dg">
<title id="wf-t">Approval workflow, start to finish</title>
<desc id="wf-d">Three lanes: Mika, the Agent Chat app and an agent. Step 1, agent: the agent finishes, sets its task to review and writes a result. Step 2, app: the app reads the task files and shows a Needs you card; the count goes into the window title and the tray, and the app starts its own review clock. Step 3, Mika: Mika opens the thread and presses Draft approval; the composer gets approve and the task id, and Enter does not send. Step 4, Mika: Mika types the action; the preview shows will sign with the task and action, or a near miss and why. Step 5, app: Sign and send by a real click or Ctrl+Enter; is there an action and does the text fit the grammar? If not, nothing is sent, the draft is kept and the app asks what is being approved. If yes, step 6: the main process signs the line, appends it to the log and classifies it; the badge shows the task and action. Step 7: the card clears with You approved, the action and the time, but only if the approval came after the review started. Step 8, agent: the agent reads the line through the CLI, which cannot verify it, so it is advice; push, delete and send still need the runtime permission prompt.</desc>
