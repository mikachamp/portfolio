<path class="ln" d="M190,148 H226" marker-end="url(#am)"/>

<rect class="grp-m" x="230" y="40" width="330" height="216" rx="12"/>
<text class="tt" x="246" y="66">MobileNetV2 base &#183; frozen</text>
<text class="ts" x="246" y="86">TensorFlow Hub &#183; ImageNet weights</text>
<rect class="bx" x="246" y="100" width="298" height="58" rx="8"/>
<text class="t" x="258" y="123">hub.KerasLayer(trainable=False)</text>
<text class="ts" x="258" y="143">mobilenet_v2_130_224/classification/4</text>
<rect class="bx" x="246" y="168" width="145" height="72" rx="8"/>
<text class="t" x="258" y="192">5,432,713</text>
<text class="ts" x="258" y="210">parameters</text>
