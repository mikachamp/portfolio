<g class="dg">
<title id="arch-t">Model architecture</title>
<desc id="arch-d">A batch of 32 images, each 224 by 224 pixels with 3 colour channels and values from 0 to 1, goes into the MobileNetV2 base from TensorFlow Hub, mobilenet_v2_130_224 classification version 4. The base is frozen and has 5,432,713 parameters that are not trained. It outputs 1001 ImageNet class scores per image. A dense layer with 120 units and softmax, the only trained part with 120,240 parameters, turns those into 120 breed probabilities. The highest probability gives the breed label. Training uses the Adam optimiser, categorical focal cross-entropy loss, accuracy as the metric, TensorBoard logging and early stopping on validation accuracy with patience 5. The model has 5,552,953 parameters in total.</desc>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker>
</defs>
