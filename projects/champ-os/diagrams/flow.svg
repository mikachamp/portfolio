<title id="flow-t">CHAMP OS data flow</title>
<desc id="flow-d">Two paths into one local vault. The main path, drawn first: you assign a task as a markdown file in the queue; the lead agent (Claude or Gemini, cloud models) and the role agents work on it under a lock file and write a result note with status review. Review, design and UX, security and privacy gates and your approval come before anything ships, and only you mark it done. The lead agent prompts go to its cloud model provider. The smaller always-on fleet of one orchestrator and 13 agents is triggered by eight scheduled jobs, Director loops and you in the app. An agent builds a prompt from the task and vault notes and calls the shared model caller, which uses a local model by default and falls back to the Gemini API when the local model is down. The Researcher agent and the app chat page call Anthropic. Results from both paths are written as markdown into the vault on the local disk and shown in the dashboard and Agent Chat.</desc>
