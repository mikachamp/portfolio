<title id="flow-t">CHAMP OS data flow</title>
<desc id="flow-d">Inputs are: the user through the dashboard, Agent Chat, tray menu and offline chat; eight scheduled jobs; the Director loops; vault notes read as context; and system checks such as npm audit and the firewall state. An agent builds a prompt and calls the shared model caller. If LM Studio is reachable the prompt goes to the local model and nothing leaves the PC. If not, it falls back to the Google Gemini API, unless the provider is set to local only. The Researcher agent and the app chat page always use the Anthropic API. Offline chat only uses local models. Results are written to the vault as markdown under Logs, Notes and Tasks, and shown on the dashboard, in Agent Chat and as Windows notifications.</desc>
