<title id="wf-t">Always-on fleet: Director workflow with the approval step</title>
<desc id="wf-d">Four lanes: You, Director, Agent and Vault. Step 1: you open CHAMP OS; the app starts the fleet and tells the orchestrator a session started. Step 2: the Director writes a check-in from gathered facts with a model call, ending with a question that offers one of 8 allowed actions. Step 3: you reply in Agent Chat. Step 4, the approval step: the Director reads the reply; if you agreed and the action is on the allowlist, it continues; if not, the reply is routed as a new request or it asks one follow-up question. Step 5: the orchestrator posts to the agent's trigger; the agent sets its state to Working, calls the model and writes a note. Step 6: the note, the chat and the director log are saved in the vault. Step 7: the result is posted back into Agent Chat.</desc>
