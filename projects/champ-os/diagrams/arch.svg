<title id="arch-t">CHAMP OS architecture</title>
<desc id="arch-d">The main path, drawn first: Mika assigns and approves tasks at the terminal or with a signed Agent Chat line. A lead agent, Claude Code or Gemini via Antigravity (cloud models), orchestrates 33 specialist role agents through a markdown task queue with lock files in the Obsidian vault. Tasks pass an explorer, builder roles, a reviewer, a design and UX check, security and privacy roles and a scribe. A human approval gate stops anything that publishes, sends, pushes, deletes, spends or changes security settings, and only Mika marks a task done. Below it, a smaller always-on fleet: a desktop app (Electron) and a PM2 fleet of one orchestrator and 13 agents on this PC. Its model provider is a local model by default with a Gemini fallback. The Researcher agent and the app chat page call Anthropic (Claude). Everything is stored as markdown in the vault on the local disk.</desc>
<defs>
