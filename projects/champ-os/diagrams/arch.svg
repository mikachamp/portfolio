<text class="ts" x="258" y="144">Claude Code, or Gemini</text>
<text class="ts" x="258" y="160">via Antigravity</text>
<text class="ts" x="258" y="176">(cloud models)</text>
<path class="ln" d="M206,152 H246" marker-end="url(#am)"/>
