<text class="ts" x="36" y="88">tasks move through a markdown queue with lock files, and through human, review and security gates</text>
<rect class="bx" x="36" y="104" width="170" height="96" rx="8"/>
<text class="t" x="48" y="126">You (Mika)</text>
<text class="ts" x="48" y="144">assign and approve</text>
<text class="ts" x="48" y="160">at the terminal or a</text>
<text class="ts" x="48" y="176">signed Agent Chat line</text>
<rect class="bx-c" x="246" y="104" width="200" height="96" rx="8"/>
