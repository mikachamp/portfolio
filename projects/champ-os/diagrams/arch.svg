<title id="arch-t">CHAMP OS architecture</title>
<desc id="arch-d">The Electron desktop app has a renderer, a preload bridge with context isolation, and a main process. The main process starts a PM2 fleet of 15 Node services that only this PC can reach and talks to the orchestrator over HTTP. The orchestrator routes to 13 agents and a local-model service. Agents can call a local model through LM Studio or a standalone llama-server, and fall back to the Google Gemini API when LM Studio is down. The Researcher agent and the app's chat page call the Anthropic API. The app and the fleet read and write an Obsidian vault of markdown files on the local disk.</desc>
