<text class="t" x="500" y="122">33 specialist role agents</text>
<text class="ts" x="500" y="138">run by the lead, in a fixed pipeline</text>
<rect class="bx" x="498" y="148" width="204" height="50" rx="6"/>
<text class="tn" x="508" y="169">1 Explorer</text>
<text class="ts" x="508" y="187">finds what is relevant</text>
<rect class="bx" x="712" y="148" width="204" height="50" rx="6"/>
<text class="tn" x="722" y="169">2 Builder roles</text>
<text class="ts" x="722" y="187">web &#183; app &#183; 3D &#183; writing</text>
<rect class="bx" x="498" y="206" width="204" height="50" rx="6"/>
<text class="tn" x="508" y="227">3 Reviewer</text>
<text class="ts" x="508" y="245">failed review goes back</text>
<rect class="bx" x="712" y="206" width="204" height="50" rx="6"/>
<text class="tn" x="722" y="227">4 Design and UX check</text>
<text class="ts" x="722" y="245">for anything people see</text>
<rect class="bx" x="498" y="264" width="204" height="50" rx="6"/>
<text class="tn" x="508" y="285">5 Security and privacy</text>
<text class="ts" x="508" y="303">read-only roles</text>
<rect class="bx" x="712" y="264" width="204" height="50" rx="6"/>
<text class="tn" x="722" y="285">6 Scribe</text>
<text class="ts" x="722" y="303">result note + lessons</text>
