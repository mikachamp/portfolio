<text class="ts" x="650" y="510">notes and reports</text>
<rect class="grp" x="20" y="516" width="700" height="172" rx="12"/>
<text class="tt" x="36" y="542">Always-on fleet &#183; a second, smaller layer</text>
<text class="ts" x="36" y="560">1 orchestrator + 13 agents under PM2, on this PC</text>
<rect class="bx" x="36" y="574" width="180" height="96" rx="8"/>
<text class="t" x="48" y="596">Desktop app</text>
