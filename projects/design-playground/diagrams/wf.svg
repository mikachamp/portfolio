<g class="dg">
<title id="wf-t">Site Tuner workflow with the review and save steps</title>
<desc id="wf-d">Four lanes: Me, Playground, Preview (sandboxed frame) and Save (serve.py). Step 1: I pick a site and move a slider or tick a section. Step 2: the playground waits 150 milliseconds, then sends the settings by postMessage. Step 3: the hook in the sandboxed page checks the sender and the message shape, clamps the values and applies them; the live preview updates. Step 4: I adjust, with Undo or Reset, until it is right. Step 5: Review shows a plain-language summary over the raw diff; the server builds the diff in diff mode, writes nothing and returns a hash. Step 6: I press Save, sending that hash. Step 7: the server checks the request is valid and the file still matches the hash. If not, it is refused with a 4xx error and nothing is written. Step 8: if yes, it makes a backup, then replaces only the settings block. Step 9: the preview and the plain site reload and show the saved settings.</desc>
