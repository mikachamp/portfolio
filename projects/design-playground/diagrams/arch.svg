<title id="arch-t">Design Playground architecture</title>
<desc id="arch-d">The Design Playground page runs in my browser and has three parts: Mix and check, the Site Tuner, and Exports. It loads its data library from five JSON files written by my research agents, or from a built and validated bundle when opened from disk. The Mix panels set matching CSS variables inside a real-page frame that is sandboxed with no scripts. The Site Tuner talks by postMessage, in both directions, to a second frame that runs scripts but never shares the playground's origin; inside it, each of five hooked sites carries a small tuner hook that listens only when the page is opened with ?tuner=1 and clamps every value. A Python server, serve.py, bound to this PC only, serves only the playground and the tuned sites, checks the Host header and lists no folders. Its one write route, the save endpoint, takes settings JSON from the Site Tuner, makes a diff first, then writes only after strict checks, with a backup and an atomic replace, into the tuner-settings block of a site's working copy.</desc>
