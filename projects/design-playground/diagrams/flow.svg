<title id="flow-t">Design Playground data flow</title>
<desc id="flow-d">Three sources feed the tool: research agents write palettes, fonts, styles and themes as JSON with sources; five draft project profiles name a theme plus overrides and a preview page; and I make picks and move sliders and switches. Each passes a check: the bundle is built and validated so every id resolves and a stale bundle fails with a fix line; the playground range-checks colours, sizes and easings and drops any value that fails; Site Tuner rules are checked three times, by the playground, by the page hook and by the save server. Results end up as files I export (tokens.css, picks.json, settings JSON), as favourites and project picks in this browser's localStorage, or in a site working copy's tuner-settings block with a backup. The only outside call the playground makes is to Google Fonts.</desc>
