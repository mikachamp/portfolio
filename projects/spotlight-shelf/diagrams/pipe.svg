<desc id="pipe-d">Before the demo, done once: step 1, five matching scene images were generated with AI (Higgsfield, Nano Banana Pro) as PNG. Step 2, the practice build linked to them on a CDN, about 30 megabytes. The site's Content Security Policy only allows images from the site itself, so the files were copied in. Step 3, they were downloaded once and saved as JPG, about 2 megabytes. In the browser: step 4, five 2752 by 1536 JPGs ship in demo/media, 1.9 megabytes measured. Step 5, demo.js loads the dark and lit scenes at start and a close-up on click, all from the same origin. Separately, four still frames from an AI video I generated are used as mood figures on this page only.</desc>
