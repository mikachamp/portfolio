<title id="arch-t">Spotlight Shelf component architecture</title>
<desc id="arch-d">The visitor's hover, click or tap and Escape key reach four handlers in demo.js through five hit areas, the Back button and the keyboard. light(i) clips the lit scene image to a cone over bottle i. zoom(i) sets open to i and scales the stage 3.2 times over 1.4 seconds. card(p) runs 650 milliseconds after the click and fills the product card with the name, notes and sizes. The Back handler, from the Back button or Escape, sets open back to minus one and undoes the rest. The handlers read the bottle array P and the close-up map CLOSE and set open. Scene layers: the dark scene, the lit scene, the hit areas and a full-screen close-up layer for bottles 1, 3 and 5. Overlay: the product card, an Add to bag button that has no handler, and the Back to the shelf button.</desc>
