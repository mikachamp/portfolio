<title id="wf-t">Spotlight Shelf interaction workflow</title>
<desc id="wf-d">Three lanes: Visitor, demo.js and Screen. Step 1: the visitor hovers a bottle with a mouse; light(i) runs only while open is minus one, and leaving runs light(-1); the screen shows a cone of light on that bottle, fading in over 0.45 seconds. Step 2: the visitor clicks or taps a bottle; zoom(i) sets open to i and lights the bottle; the screen pushes in 3.2 times over 1.4 seconds and shows the Back button. 650 milliseconds after the click, card(p) shows the product card with name, notes and two size buttons. If the bottle has a close-up (bottles 1, 3 and 5), the close-up layer fades in from 700 milliseconds. Step 3: the visitor picks a size, which is highlighted; Add to bag does nothing. Step 4: the visitor presses Back or Escape; the Back handler sets open to minus one and hides the card; the shelf returns at normal scale with the light off, ready for the next bottle.</desc>
