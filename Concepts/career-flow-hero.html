<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js'

/* ---------- career stages (text matches the CV; shown by the parent page) ---------- */
const STAGES = [
  { t1: 5.4, y: '2021–24', n: 'Robotics', k: 'Apr 2021 – Nov 2024 · Eduvos, Cape Town' },
  { t1: 13.5, y: '2023– · 2025–', n: 'Print · CNC · laser', k: 'Dime3 Nov 2023 – · Blueprint Digital Apr 2025 –' },
  { t1: 21.2, y: '2025–', n: 'Design · assembly', k: 'Blueprint Digital & Dime3 · CAD and product design' },
  { t1: 29.4, y: 'Now', n: 'AI agents', k: '2026 – present · Mika OS', ai: true }
]
const TOTAL = 30.4
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
const stageAt = (t) => { for (let i = 0; i < STAGES.length; i++) if (t < STAGES[i].t1) return i; return STAGES.length - 1 }
let shown = -1
function updUI(t) {
  const si = stageAt(t); if (si === shown) return; shown = si
  const s = STAGES[si]
  try { parent.postMessage({ type: 'career-stage', y: s.y, n: s.n, k: s.k, ai: !!s.ai }, '*') } catch (e) {}
}

/* ---------- renderer ---------- */
const cv = document.getElementById('scene')
let R
try { R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' }) } catch (e) { cv.style.display = 'none'; updUI(0); throw e }
const small = Math.min(innerWidth, innerHeight) < 700
R.setPixelRatio(Math.min(devicePixelRatio || 1, small ? 1.5 : 1.75))
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 0.92
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap
R.setClearColor(0x0b0c0e, 1)
const maxA = R.capabilities.getMaxAnisotropy()
const scene = new THREE.Scene()
scene.fog = new THREE.Fog(0x0b0c0e, 17, 38)
scene.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), .04).texture
scene.environmentIntensity = .38
const cam = new THREE.PerspectiveCamera(38, 1, .1, 120)

const AMBER = new THREE.Color('#ff9d42'), AI = new THREE.Color('#7fd6ff'), LASER = new THREE.Color('#ff5a2a')
const key = new THREE.DirectionalLight(0xffe9d2, 2.1); key.position.set(6, 12, 9); key.castShadow = true
key.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048); key.shadow.bias = -.0004; key.shadow.normalBias = .02
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 7, bottom: -6, near: 2, far: 34 })
const rim = new THREE.DirectionalLight(0x9cc2ff, 1.2); rim.position.set(-9, 6, -9)
const hemi = new THREE.HemisphereLight(0xcfd8ff, 0x1a140e, .3)
scene.add(key, rim, hemi)
const hotC = new THREE.PointLight(0xffc98a, 0, 3.2, 1.6), hotL = new THREE.PointLight(0xff5a2a, 0, 3.2, 1.6), hotP = new THREE.PointLight(0xff9d42, 0, 2.4, 1.6)
const aiLight = new THREE.PointLight(0x7fd6ff, 0, 14, 1.4); aiLight.position.set(0, 4.4, .4)
scene.add(hotC, hotL, hotP, aiLight)

/* ---------- helpers ---------- */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z)
const cl = (x) => Math.min(1, Math.max(0, x)), sm = (x) => { x = cl(x); return x * x * (3 - 2 * x) }, seg = (t, a, b) => sm((t - a) / (b - a))
const shade = (m, cast = true) => { m.castShadow = cast; m.receiveShadow = true; return m }
function add(geo, mat, x = 0, y = 0, z = 0, parent = scene) { const m = shade(new THREE.Mesh(geo, mat)); m.position.set(x, y, z); parent.add(m); return m }
const rbox = (w, h, d, mat, x, y, z, parent, r = .03) => add(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2.2, h / 2.2, d / 2.2)), mat, x, y, z, parent)
const box = (w, h, d, mat, x, y, z, parent) => add(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent)
const cylGeo = (r, h, seg = 40, r2 = r) => new THREE.CylinderGeometry(r, r2, h, seg)
const std = (o) => new THREE.MeshStandardMaterial(o)
const glow = (c) => new THREE.MeshBasicMaterial({ color: c, toneMapped: false })

/* procedural textures (no image files) */
function canvasTex(w, h, draw, { srgb = true, repeat } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h)
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxA
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat) }
  return t
}
function noise(g, w, h, amt, tint = [1, .85, .6]) { const img = g.getImageData(0, 0, w, h), d = img.data; for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * amt; d[i] += n * tint[0]; d[i + 1] += n * tint[1]; d[i + 2] += n * tint[2] } g.putImageData(img, 0, 0) }
const TX = {
  mdf: canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#b98b5c'; g.fillRect(0, 0, w, h); noise(g, w, h, 24) }),
  mdfEdge: canvasTex(256, 32, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#8d6a45'); gr.addColorStop(.15, '#d9b98f'); gr.addColorStop(.5, '#e4c79f'); gr.addColorStop(.85, '#d9b98f'); gr.addColorStop(1, '#8d6a45'); g.fillStyle = gr; g.fillRect(0, 0, w, h); noise(g, w, h, 40) }),
  stack: canvasTex(64, 256, (g, w, h) => { for (let y = 0; y < h; y += 16) { g.fillStyle = '#a7865f'; g.fillRect(0, y, w, 14); g.fillStyle = '#5e432a'; g.fillRect(0, y + 14, w, 2) } noise(g, w, h, 30) }, { repeat: [8, 1] }),
  spoil: canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#7a5b3b'; g.fillRect(0, 0, w, h); noise(g, w, h, 18); g.strokeStyle = 'rgba(30,18,8,.45)'; g.lineWidth = 1.5; for (let i = 0; i <= w; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.moveTo(0, i); g.lineTo(w, i); g.stroke() } g.strokeStyle = '#141414'; g.lineWidth = 6; g.strokeRect(12, 12, w - 24, h - 24); g.beginPath(); g.moveTo(w / 2, 12); g.lineTo(w / 2, h - 12); g.stroke() }),
  concrete: canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#2b2c30'; g.fillRect(0, 0, w, h); noise(g, w, h, 26, [1, 1, 1]); g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h) }, { repeat: [10, 10] }),
  powder: canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#808080'; g.fillRect(0, 0, w, h); noise(g, w, h, 60, [1, 1, 1]) }, { srgb: false, repeat: [3, 3] }),
  blob: canvasTex(128, 128, (g) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(0,0,0,.7)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128) }),
  brush: canvasTex(256, 32, (g, w, h) => { for (let x = 0; x < w; x += 2) { g.fillStyle = `rgba(${18 + Math.random() * 25},${18 + Math.random() * 20},${16 + Math.random() * 15},${.55 + Math.random() * .4})`; g.fillRect(x, 0, 1.3, h * (.82 + Math.random() * .18)) } }, { repeat: [3, 1] }),
  hose: canvasTex(32, 32, (g, w, h) => { for (let y = 0; y < h; y += 8) { g.fillStyle = '#3a3d42'; g.fillRect(0, y, w, 5); g.fillStyle = '#1d1f22'; g.fillRect(0, y + 5, w, 3) } }, { repeat: [1, 60] }),
  honey: canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#111316'; g.fillRect(0, 0, w, h); g.strokeStyle = '#7d848d'; g.lineWidth = 1.6
    const r = 9, dx = r * Math.sqrt(3), dy = r * 1.5
    for (let row = 0, y = 0; y < h + r; row++, y += dy) for (let x = (row % 2) * dx / 2; x < w + dx; x += dx) { g.beginPath(); for (let i = 0; i <= 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) } g.stroke() }
  }, { repeat: [3, 2] }),
  butcher: canvasTex(512, 256, (g, w, h) => { for (let y = 0; y < h; y += 16) { g.fillStyle = `hsl(${28 + Math.random() * 6},${38 + Math.random() * 10}%,${38 + Math.random() * 10}%)`; g.fillRect(0, y, w, 15) } noise(g, w, h, 18) }),
  plank: canvasTex(256, 64, (g, w, h) => { g.fillStyle = '#9c7a52'; g.fillRect(0, 0, w, h); noise(g, w, h, 34) })
}
function label(text, w, h, { bg = '#e9eaec', fg = '#1b1c1f', stripe } = {}) {
  return canvasTex(w * 128, h * 128, (g, cw, ch) => {
    g.fillStyle = bg; g.fillRect(0, 0, cw, ch)
    if (stripe) { g.save(); g.beginPath(); g.rect(0, 0, ch * .9, ch); g.clip(); g.fillStyle = '#111'; for (let x = -ch; x < ch * 2; x += ch * .3) { g.beginPath(); g.moveTo(x, ch); g.lineTo(x + ch * .15, ch); g.lineTo(x + ch * .15 + ch, 0); g.lineTo(x + ch, 0); g.fill() } g.restore() }
    g.fillStyle = fg; g.font = `700 ${ch * .5}px "JetBrains Mono", ui-monospace, monospace`; g.textBaseline = 'middle'
    g.fillText(text, stripe ? ch * 1.05 : ch * .3, ch / 2 + 1)
  })
}
const decal = (tex, w, h, x, y, z, parent, ry = 0) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), std({ map: tex, roughness: .5 })); m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m }

const M = {
  frame: std({ color: 0x26292e, metalness: .5, roughness: .55, roughnessMap: TX.powder }),
  paint: std({ color: 0xdadde2, metalness: .25, roughness: .42, roughnessMap: TX.powder }),
  accent: std({ color: 0xff8a2a, metalness: .25, roughness: .45, roughnessMap: TX.powder }),
  alu: std({ color: 0xc4c9cf, metalness: .9, roughness: .32 }),
  rail: std({ color: 0xd2d7dc, metalness: 1, roughness: .16 }),
  block: std({ color: 0x9aa1aa, metalness: .9, roughness: .3 }),
  dark: std({ color: 0x16181b, metalness: .4, roughness: .62 }),
  rubber: std({ color: 0x101112, metalness: 0, roughness: .9 }),
  steel: std({ color: 0xa3aab3, metalness: 1, roughness: .22 }),
  bolt: std({ color: 0x8c939c, metalness: 1, roughness: .3 }),
  carbide: std({ color: 0xe0e3e8, metalness: 1, roughness: .1 }),
  brass: std({ color: 0xc89b4a, metalness: 1, roughness: .3 }),
  red: std({ color: 0xd81f1f, metalness: .1, roughness: .35 }),
  yellow: std({ color: 0xf2c230, metalness: .1, roughness: .5 }),
  brush: std({ map: TX.brush, transparent: true, alphaTest: .25, side: THREE.DoubleSide, roughness: .9, metalness: 0 }),
  hose: std({ map: TX.hose, color: 0x9aa0a8, roughness: .6, metalness: .1 }),
  shell: std({ color: 0xe9eaec, roughness: .38, metalness: .05 }),
  black: std({ color: 0x141518, roughness: .45, metalness: .2 }),
  matte: std({ color: 0x1c1d20, roughness: .8, metalness: .05 }),
  chrome: std({ color: 0xd5d9de, roughness: .14, metalness: 1 }),
  carbon: std({ color: 0x0d0e10, roughness: .35, metalness: .4 }),
  tint: new THREE.MeshPhysicalMaterial({ color: 0x15181d, roughness: .04, metalness: 0, transparent: true, opacity: .3, envMapIntensity: 1.6, depthWrite: false }),
  dome: new THREE.MeshPhysicalMaterial({ color: 0xcfd6dd, roughness: .03, transparent: true, opacity: .2, envMapIntensity: 1.5, depthWrite: false, side: THREE.DoubleSide }),
  orangeLid: new THREE.MeshPhysicalMaterial({ color: 0xff7a1a, roughness: .06, metalness: 0, transparent: true, opacity: .34, envMapIntensity: 1.4, depthWrite: false, side: THREE.DoubleSide }),
  robot: std({ color: 0x30343b, metalness: .35, roughness: .42, roughnessMap: TX.powder }),
  robotAccent: std({ color: 0xff8a2a, metalness: .2, roughness: .4, roughnessMap: TX.powder }),
  robotGrey: std({ color: 0x2a2d33, metalness: .45, roughness: .5 })
}
const boltGeo = cylGeo(.026, .02, 6)
function bolts(parent, list) {
  const im = new THREE.InstancedMesh(boltGeo, M.bolt, list.length), o = new THREE.Object3D()
  list.forEach(([x, y, z, n], i) => { o.position.set(x, y, z); o.rotation.set(0, 0, 0); if (n[0] === 'x') o.rotation.z = Math.PI / 2; else if (n[0] === 'z') o.rotation.x = Math.PI / 2; o.updateMatrix(); im.setMatrixAt(i, o.matrix) })
  im.castShadow = true; parent.add(im); return im
}
function gearGeo(r, teeth, depth, width) {
  const s = new THREE.Shape(), n = teeth * 4
  for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, rr = (i % 4 < 2) ? r : r - depth; i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) }
  const g = new THREE.ExtrudeGeometry(s, { depth: width, bevelEnabled: false, curveSegments: 1 }); g.translate(0, 0, -width / 2); g.rotateY(Math.PI / 2); return g
}
function motorGeo() {
  const parts = [new RoundedBoxGeometry(.34, .5, .34, 2, .03).translate(0, .25, 0)]
  for (let i = 0; i < 6; i++) parts.push(new THREE.BoxGeometry(.4, .025, .4).translate(0, .08 + i * .07, 0))
  parts.push(cylGeo(.05, .1, 16).translate(.12, .5, .1), cylGeo(.12, .06, 24).translate(0, -.03, 0))
  return mergeGeometries(parts.map(p => p.index ? p.toNonIndexed() : p))
}
const MOTOR = motorGeo()

/* ---------- layout (world units; same plan as Career Flow v3) ---------- */
const CNC = V(-3.7, 0, -.5), LZ = V(3.7, 0, -.5), PR = V(0, 0, -2.0), AS = V(0, 0, 2.5)
const STA = V(-6.4, -.2, 2.4), STB = V(6.4, -.2, 2.4)
const RS = .37                       // router model scale (concept D2 is built at 1 unit ≈ 120 mm)
const RY = .07 * RS                  // lifts the router so its spoilboard top sits at y = 0
const FLOOR = RY - 3 * RS            // the router's feet set the floor height
const floor = add(new THREE.PlaneGeometry(80, 80), std({ map: TX.concrete, roughness: .92, metalness: 0 }), 0, FLOOR, 0); floor.rotation.x = -Math.PI / 2; floor.castShadow = false
const blobMat = new THREE.MeshBasicMaterial({ map: TX.blob, transparent: true, depthWrite: false })
function blob(x, z, sx, sz, o = 1) { const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), blobMat.clone()); m.material.opacity = o; m.rotation.x = -Math.PI / 2; m.position.set(x, FLOOR + .004, z); scene.add(m) }

/* =================================================================================
   CNC router — concept D2's 1325 gantry router, scaled into the workshop
   ================================================================================= */
const RT = new THREE.Group(); RT.position.set(CNC.x, RY, CNC.z); RT.scale.setScalar(RS); scene.add(RT)
const TABLE = { w: 11, d: 7.4 }, W2 = TABLE.w / 2, RF = -3
blob(CNC.x, CNC.z, 17 * RS, 12 * RS, .7)
rbox(TABLE.w + 1.4, .7, TABLE.d + .8, M.frame, 0, -.6, 0, RT, .05)
for (const sx of [-1, 1]) for (const sz of [-1, 1]) { rbox(.5, 2.15, .5, M.frame, sx * W2, -2.0, sz * TABLE.d / 2, RT, .04); add(cylGeo(.16, .08, 24), M.steel, sx * W2, RF + .04, sz * TABLE.d / 2, RT) }
for (const sz of [-1, 1]) rbox(TABLE.w, .22, .22, M.frame, 0, -2.4, sz * TABLE.d / 2, RT, .03)
for (const sx of [-1, 1]) rbox(.22, .22, TABLE.d, M.frame, sx * W2, -2.4, 0, RT, .03)
add(new THREE.BoxGeometry(TABLE.w, .18, TABLE.d), std({ map: TX.spoil, roughness: .95 }), 0, -.16, 0, RT)
for (const sz of [-1, 1]) { box(TABLE.w - .2, .03, .16, M.alu, 0, -.065, sz * (TABLE.d / 2 - .22), RT); box(TABLE.w - .2, .032, .045, M.dark, 0, -.062, sz * (TABLE.d / 2 - .22), RT) }
const RACK_X = W2 + .55, RAIL_X = W2 + .2, LEN = TABLE.d + .6
{ const teethGeo = new THREE.BoxGeometry(.11, .035, .03); teethGeo.rotateY(.32)
  const P = .06, n = Math.floor(LEN / P), teeth = new THREE.InstancedMesh(teethGeo, M.steel, n * 2), o = new THREE.Object3D(); let k = 0
  for (const sx of [-1, 1]) {
    box(.16, .08, LEN, M.frame, sx * RAIL_X, -.21, 0, RT); box(.11, .07, LEN, M.rail, sx * RAIL_X, -.135, 0, RT); box(.1, .1, LEN, M.steel, sx * RACK_X, -.12, 0, RT)
    for (let i = 0; i < n; i++) { o.position.set(sx * RACK_X, -.055, -LEN / 2 + (i + .5) * P); o.updateMatrix(); teeth.setMatrixAt(k++, o.matrix) }
  }
  teeth.castShadow = true; RT.add(teeth) }
const gantry = new THREE.Group(); RT.add(gantry)
const pinions = []
for (const sx of [-1, 1]) {
  const px = sx * (W2 + .36)
  rbox(.22, 2.72, 1.25, M.paint, px, 1.46, 0, gantry, .05)
  rbox(.5, .09, 1.35, M.accent, sx * (W2 + .4), .15, 0, gantry, .02)
  for (const z of [-.38, .38]) rbox(.3, .12, .4, M.block, sx * RAIL_X, .045, z, gantry, .02)
  pinions.push(add(gearGeo(.1, 14, .025, .1), M.steel, sx * RACK_X, .07, 0, gantry))
  rbox(.26, .22, .3, M.dark, sx * RACK_X, .32, 0, gantry, .03)
  add(MOTOR, M.dark, sx * RACK_X, .45, 0, gantry)
  const bl = []; for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) bl.push([px + sx * .115, .6 + i * .55, -.45 + j * .45, 'x'])
  bolts(gantry, bl)
}
rbox(TABLE.w + 1.1, .75, .9, M.paint, 0, 2.6, 0, gantry, .06)
for (const y of [2.45, 2.75]) box(TABLE.w + .9, .035, .01, M.dark, 0, y, -.452, gantry)
for (const y of [2.38, 2.86]) { box(TABLE.w + .4, .09, .07, M.rail, 0, y, .485, gantry); box(TABLE.w + .4, .12, .02, M.dark, 0, y, .455, gantry) }
for (const z of [-.33, -.07]) box(TABLE.w + .7, .12, .02, M.alu, 0, 3.03, z, gantry)
decal(label('MW-1325  ·  CNC ROUTER', 9, 1, { bg: '#1c1e22', fg: '#ff9d42' }), 2.6, .18, -3.6, 2.62, .452, gantry)
rbox(.1, .26, .26, M.yellow, W2 + .52, 2.35, .3, gantry, .02)
add(cylGeo(.09, .08, 32), M.red, W2 + .61, 2.35, .3, gantry).rotation.z = Math.PI / 2
const carriage = new THREE.Group(); gantry.add(carriage)
rbox(1.15, 1.25, .2, M.accent, 0, 2.6, .63, carriage, .04)
for (const y of [2.38, 2.86]) for (const x of [-.38, .38]) rbox(.26, .15, .1, M.block, x, y, .5, carriage, .015)
for (const x of [-.3, .3]) box(.07, 1.2, .06, M.rail, x, 2.6, .76, carriage)
bolts(carriage, [[-.5, 3.12, .735, 'z'], [.5, 3.12, .735, 'z'], [-.5, 2.08, .735, 'z'], [.5, 2.08, .735, 'z']])
const SCREW = { x: -.52, z: .82, y0: 2.0, y1: 3.2 }
{ const pts = [], turns = 22
  for (let i = 0; i <= turns * 14; i++) { const a = i / 14 * Math.PI * 2; pts.push(V(Math.cos(a) * .042, SCREW.y0 + (i / (turns * 14)) * (SCREW.y1 - SCREW.y0), Math.sin(a) * .042)) }
  const thread = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), turns * 14, .011, 5)
  add(mergeGeometries([thread.toNonIndexed(), cylGeo(.036, SCREW.y1 - SCREW.y0, 20).translate(0, (SCREW.y0 + SCREW.y1) / 2, 0).toNonIndexed()]), M.steel, SCREW.x, 0, SCREW.z, carriage)

  const ck = cl((t - 6.2) / (11.0 - 6.2)), cIn = seg(t, 5.0, 6.0), bitDown = seg(t, 5.9, 6.2) * (1 - seg(t, 11.0, 11.3))
  const cp0 = rrCurve.getPointAt(ck, tmp2)
  const out = 1 - seg(t, 11.3, 12.3)
  const PARK = V(CNC.x + 1.4, 0, CNC.z - .7)
  let bx = CNC.x + cp0.x, bz = CNC.z + cp0.z
  if (t < 6.2) { bx = PARK.x + (bx - PARK.x) * cIn; bz = PARK.z + (bz - PARK.z) * cIn } else if (t > 11.3) { bx = PARK.x + (bx - PARK.x) * out; bz = PARK.z + (bz - PARK.z) * out }
  routerTo(bx, .07 + (1 - bitDown) * .3, bz)
  const cutting = t > 6.2 && t < 11.0, spinning = t > 5.4 && t < 11.6
  if (spinning && !reduce) bit.rotation.y += dt * 40
  pinions.forEach(p => { p.rotation.x = -gantry.position.z * 10 })
  ledMat.color.set(cutting ? 0x3ee08f : spinning ? 0xffb347 : 0x2a2a2a)
  cGroove.visible = t > 6.2 && t < 21.5
  cGrooveGeo.setDrawRange(0, Math.floor(cIdx * ck / 6) * 6)
  if (cutting && dt > 0 && !reduce) { emit(bx, .12, bz); emit(bx, .12, bz) }
  hotC.intensity = cutting ? 2.2 : 0; hotC.position.set(bx, .3, bz)
  plate.visible = t > 11.0 && t < 21.4
  if (t < WIN.aPlate[0]) plate.position.set(pPlateOnBed.x, .08 + seg(t, 11.2, 11.8) * .06, pPlateOnBed.z)
  else if (t < WIN.aPlate[1]) plate.position.copy(tA); else plate.position.copy(pPlateOnTable)

  /* laser: outer then inner circle */
  const lk1 = cl((t - 6.0) / (8.4 - 6.0)), lk2 = cl((t - 8.6) / (10.6 - 8.6))
  const lasing = (t > 6.0 && t < 8.4) || (t > 8.6 && t < 10.6)
  const la = (t < 8.5 ? lk1 : lk2) * Math.PI * 2, lr = t < 8.5 ? GO : GI
  const lx = t < 6.0 ? 1.2 : Math.cos(la) * lr, lz = t < 6.0 ? -.9 : Math.sin(la) * lr
  lGant.position.z = lz - .1; lHead.position.x = lx
  const bl = NOZZLE_Y - (BED_Y + .04); beam.scale.y = bl / .05; beam.position.set(0, -.28 - bl / 2, .1); spark.position.set(0, -.28 - bl, .1)
  beam.visible = spark.visible = lasing; spark.scale.setScalar(1 + .4 * Math.sin(t * 40))
  hotL.intensity = lasing ? 2.4 : 0; hotL.position.set(LZ.x + lx, .5, LZ.z + lz)
  kerfO.visible = t > 6.0 && t < 21.5; kerfI.visible = t > 8.6 && t < 21.5
  kO.setDrawRange(0, Math.floor(kN * lk1 / 6) * 6); kI.setDrawRange(0, Math.floor(kN * lk2 / 6) * 6)
  kerfM.color.copy(LASER).lerp(kerfEnd, seg(t, 10.6, 12.0))
  gimbal.visible = t > 10.6 && t < 21.4
  if (t < WIN.bGim[0]) { gimbal.position.set(pGimOnBed.x, pGimOnBed.y + seg(t, 11.8, 12.4) * .04, pGimOnBed.z); gimbal.rotation.set(0, 0, 0) }
  else if (t < WIN.bGim[1]) { gimbal.position.copy(tB); gimbal.rotation.set(gimTilt * Math.PI / 2, 0, 0) }
  else { gimbal.position.copy(pGimStand); gimbal.rotation.set(Math.PI / 2, 0, 0) }

  /* printer: bed rises to the nozzle, drops a layer at a time, then parks low; the ring slides out onto the shelf */
  const pk = cl((t - 5.6) / (12.4 - 5.6)), done = pk * LAY, cur = Math.min(LAY - 1, Math.floor(done))
  const printing = t > 5.6 && t < 12.4
  const bedPrint = NOZ_Y - .02 - (cur + 1) * LH / PS
  pBed.position.y = t < 4.6 ? BED_LOW : t < 5.6 ? BED_LOW + (bedPrint - BED_LOW) * seg(t, 4.6, 5.5) : t < 12.4 ? bedPrint : bedPrint + (BED_LOW - bedPrint) * seg(t, 12.4, 13.2)
  const ha = t * 8, hm = (RO + RI) / 2
  pHead.position.x = printing ? Math.cos(ha) * hm / PS + .17 : 0; xBeam.position.z = printing ? Math.sin(ha) * hm / PS : -1.2
  pTip.visible = printing; hotP.intensity = printing ? 1.2 : 0
  hotP.position.set(PR.x + (pHead.position.x - .17) * PS, PED + NOZ_Y * PS - .05, PR.z + xBeam.position.z * PS)
  chamberLight.intensity = printing ? .9 : .25
  pDoor.rotation.y = -seg(t, 12.6, 13.2) * 1.5 * (1 - seg(t, 19.2, 19.8))
  spools.forEach((s, i) => { if (printing && !reduce && i === 2) s.rotation.x -= dt * .8 })
  ring.visible = t > 5.6 && t < 21.4
  for (let i = 0; i < LAY; i++) { const L = rLayers[i]; L.visible = i <= cur && (pk >= 1 || i < done); L.material.emissiveIntensity = t < 12.6 ? Math.max(0, .9 - (done - i) / 4 * .9) : 0 }
  const ringOnBedY = PED + pBed.position.y * PS + RING_HALF
  if (t < 13.3) { ring.position.set(PR.x, ringOnBedY, PR.z); ring.rotation.set(0, 0, 0) }
  else if (t < WIN.aRing[0]) { const k = seg(t, 13.3, 14.3); ring.position.set(PR.x, pRingBed.y + (pRingOut.y - pRingBed.y) * k + Math.sin(k * Math.PI) * .05, PR.z + (pRingOut.z - PR.z) * k); ring.rotation.set(0, 0, 0) }
  else if (t < WIN.aRing[1]) { ring.position.copy(tA); ring.rotation.set(0, 0, 0) }
  else { ring.position.copy(pRingIn); ring.rotation.set(0, (t - WIN.aRing[1]) * 2.4, 0) }
  if (t > 20.2) { const gs = t - 20.2; gimbal.rotation.set(Math.PI / 2, 0, gs * .5); ring.rotation.set(Math.sin(gs * .9) * .6, gs * 2.6, 0) }
  stepChips(dt)

  /* AI: the product dissolves into the network, which links to every machine */
  const pf = seg(t, 21.2, 21.6), conv = t - 21.6, fade = seg(t, 29.4, 30.3)
  const productVis = t < 21.45
  plate.visible &&= productVis; gimbal.visible &&= productVis; ring.visible &&= productVis
  parts.visible = t > 21.1
  pM.opacity = pf * (1 - fade) * .95
  pM.color.copy(AMBER).lerp(AI, cl((t - 22) / 1.8)).lerp(white, .2)
  if (parts.visible) { for (let q = 0; q < PN; q++) { const k = sm((conv - dly[q]) / 2.4), q3 = q * 3; for (let a3 = 0; a3 < 3; a3++) pp[q3 + a3] = src[q3 + a3] + (dst[q3 + a3] - src[q3 + a3]) * k } pg.attributes.position.needsUpdate = true }
  const net = seg(t, 23.6, 24.6) * (1 - fade)
  edgeM.opacity = net * .55; aiLight.intensity = net * 1.6
  nodeM.forEach((m, i) => { m.material.opacity = net * (.6 + .4 * Math.sin(t * 3 + i)); m.scale.setScalar(1 + .25 * Math.sin(t * 3 + i)) })
  const drop = seg(t, 24.6, 25.8) * (1 - fade)
  const ends = [robA.wrist(V()), robB.wrist(V()), V(bx, .9, bz), V(LZ.x + lx, NOZZLE_Y + .5, LZ.z + lz), V(PR.x, PED + (TOP + 1.5) * PS, PR.z - .1)]
  const starts = [NODES[4], NODES[9], NODES[14], NODES[19], NODES[23]]
  for (let l = 0; l < LINKS; l++) {
    const s0 = starts[l], en = ends[l]
    lpos.set([s0.x, s0.y, s0.z, s0.x + (en.x - s0.x) * drop, s0.y + (en.y - s0.y) * drop, s0.z + (en.z - s0.z) * drop], l * 6)
    const pu = (t * .6 + l / LINKS) % 1
    pulses[l].position.set(s0.x + (en.x - s0.x) * pu, s0.y + (en.y - s0.y) * pu, s0.z + (en.z - s0.z) * pu)
    pulses[l].material.opacity = drop > .98 ? .9 * (1 - fade) : 0
  }
  lgeo2.attributes.position.needsUpdate = true; links.computeLineDistances(); linkM.opacity = drop * .8
  if (t > 25.8 && t < 29.4) { const ia = t * .8; robA.ik(V(-1.6 + Math.sin(ia) * .3, 1.8 + HOLD, 2.2)); robB.ik(V(1.6 - Math.sin(ia) * .3, 1.8 + HOLD, 2.2)) }

  /* camera */
  const si = stageAt(t), nx = Math.min(3, si + 1), sd = STAGES[si], into = si === 3 ? 0 : seg(t, sd.t1 - 1.2, sd.t1 + .2)
  const gP = tmp.copy(CAMS[si].p).lerp(CAMS[nx].p, into), gL = V().copy(CAMS[si].l).lerp(CAMS[nx].l, into)
  gP.x += reduce ? 0 : Math.sin(t * .22) * .8
  if (mobile) gP.sub(gL).multiplyScalar(1.28).add(gL)
  if (snap) { camP.copy(gP); camL.copy(gL) } else { const f = Math.min(1, dt * 2); camP.lerp(gP, f); camL.lerp(gL, f) }
  cam.position.copy(camP); cam.lookAt(camL)
}

/* ---------- loop ---------- */
let T = 0, last = performance.now(), playing = !reduce, snapNext = true
function draw() { apply(T, 0, true); R.render(scene, cam); updUI(T) }
function loop(now) {
  if (!playing) return
  const dt = Math.min(.05, (now - last) / 1000); last = now
  T += dt; if (T >= TOTAL) { T = 0; clearChips() }
  apply(T, dt, snapNext); snapNext = false; R.render(scene, cam); updUI(T)
  requestAnimationFrame(loop)
}
document.addEventListener('visibilitychange', () => { if (document.hidden) playing = false; else if (!reduce) { playing = true; last = performance.now(); requestAnimationFrame(loop) } })
addEventListener('message', (e) => { const d = e.data || {}; if (d.type === 'pause') playing = false; else if (d.type === 'resume' && !playing && !reduce && !document.hidden) { playing = true; last = performance.now(); requestAnimationFrame(loop) } })
if (reduce) { T = STAGES[3].t1 - 2; draw() } else { apply(0, 0, true); updUI(0); requestAnimationFrame(loop) }
window.__cf = { set: (t) => { T = t; clearChips(); apply(T, .016, true); R.render(scene, cam); updUI(T) }, pause: () => { playing = false } }
</script>
</body></html>
